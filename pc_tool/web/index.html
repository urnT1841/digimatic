<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Digimatic Data Display</title>
    <style>
        @font-face {
            font-family: 'DigitalNum';
            src: url('./assets/UDEVGothic35LG-Regular.ttf');
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }
        #value {
            font-family: 'DigitalNum', monospace;
            font-size: 80px;
            font-weight: bold;
            color: #00FF96; /* eguiの緑 */
            margin: 20px 0;
        }
        #history {
            max-height: 200px;
            overflow-y: scroll;
            border-top: 1px solid #444;
            padding-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <small>Connection Status: <span style="color: #00FF96;">Connected</span></small>
    
    <div id="value">0.00 mm</div>
    
    <h3>履歴 (最大50件)</h3>
    <div id="history">履歴はありません（データ未受信）</div>

    <!-- コンパイルされたJSを読み込む -->
    <script src="./browser_gui.js"></script>
</body>
</html>
