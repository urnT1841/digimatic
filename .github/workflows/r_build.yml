name: Draft Release Builder

# trigger：local terminalで 「v」から始まるタグ(v1.x.yなど)をプッシュしたら起動
on:
  push:
    tags:
      - 'v*'
      - 'release/v*'
  workflow_dispatch: # manual action button

jobs:
  build:
    name: Build for ${{ matrix.os }}
    # Windows、Linux、Mac(Mシリーズ対応)の3台起動
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: digimatic-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: digimatic-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: digimatic-macos

    steps:
      # コードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # 各OS環境にRustをインストール
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 爆速ビルドのためのキャッシュを設定 (Swatinem)
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux環境固有の依存関係をインストール
      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      # 本番用バイナリのビルドを実行 (プロジェクトルートで実行されます)
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # 🌟 修正：すべてのOSでルート直下（./）にバイナリをリネーム配置するよう修正
      - name: Prepare binary path
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/digimatic.exe ./${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/digimatic ./${{ matrix.artifact_name }}
          fi

      # 直下に配置されたバイナリを回収してDraft Releaseを作成
      - name: Create Draft Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ./${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}