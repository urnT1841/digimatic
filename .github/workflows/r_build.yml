name: Draft Release Builder

# trigger：local terminalで 「v」から始まるタグ(v1.x.yなど)をプッシュしたら起動
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual actino button

jobs:
  build:
    name: Build for ${{ matrix.os }}
    # Windows、Linux、Mac(Mシリーズ対応)の3台起動
    runs-on: ${{ matrix.os }}
    # project直下に cargo.toml がないので，存在するdirを指定
    defaults:
      run:
        working-directory: pc_tool

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: digimatic-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: digimatic-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: digimatic-macos

    steps:
      # コードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # 各OS環境にRustをインストール
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 爆速ビルドのためのキャッシュを設定 (Swatinem)
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      # 本番用バイナリのビルドを実行 (cargo build --release)
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # `pc_tool/target/...` の中にあるので、正しく移動
      - name: Prepare binary path
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/digimatic.exe ./../${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/digimatic ./../${{ matrix.artifact_name }}
          fi
        #working-directory内(pc_tool)から、1つ上の階層(./../)にバイナリを投げる

      - name: Create Draft Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ./${{ matrix.artifact_name }} # 👈 直下に放り投げられたバイナリを回収！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
